<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{background:#0d1117;font-family:'Heebo',sans-serif;color:#e8eaf0;-webkit-font-smoothing:antialiased}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes vp{0%,100%{opacity:1;box-shadow:0 0 8px rgba(255,43,94,0.15)}50%{opacity:.85;box-shadow:0 0 20px rgba(255,43,94,0.35)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;outline:none;background:linear-gradient(90deg,#4a9eff 0%,#00e5a0 50%,#ff6b2b 75%,#ff2b5e 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#e8eaf0;border:3px solid #ff6b2b;cursor:pointer;box-shadow:0 0 12px rgba(255,107,43,0.5)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#e8eaf0;border:3px solid #ff6b2b;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
button:active{transform:scale(0.97)}

<script>
"use strict";
var h = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;
var useRef = React.useRef;
var useCallback = React.useCallback;

var POOLS = {
  recovery: [
    "\u05D4\u05E2\u05E8\u05D1 \u05D0\u05D9\u05DF \u05E4\u05E2\u05D9\u05DC\u05D5\u05EA \u2014 \u05D9\u05E9\u05E8 \u05DC\u05DE\u05D9\u05D8\u05D4 \u05E9\u05E2\u05D4 \u05E7\u05D5\u05D3\u05DD",
    "\u05DE\u05E7\u05DC\u05D7\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05E2\u05DD \u05DE\u05D5\u05D6\u05D9\u05E7\u05D4 \u05D0\u05DE\u05D1\u05D9\u05D9\u05E0\u05D8\u05D9\u05EA",
    "\u05DC\u05D4\u05D6\u05DE\u05D9\u05DF \u05D2'\u05D0\u05E0\u05E7 \u05E4\u05D5\u05D3 \u05DC\u05D7\u05D3\u05E8",
    "10 \u05D3\u05E7\u05D5\u05EA \u05E9\u05DB\u05D9\u05D1\u05D4 \u05E2\u05DD \u05E2\u05D9\u05E0\u05D9\u05D9\u05DD \u05E2\u05E6\u05D5\u05DE\u05D5\u05EA",
    "\u05EA\u05D4 \u05D7\u05DD + \u05D1\u05DC\u05D9 \u05DE\u05E1\u05DB\u05D9\u05DD \u05E2\u05D3 \u05D4\u05D1\u05D5\u05E7\u05E8",
    "\u05DC\u05D4\u05D5\u05E8\u05D9\u05D3 \u05D0\u05EA \u05D4\u05EA\u05D0\u05D5\u05E8\u05D4 \u05D5\u05DC\u05E9\u05DE\u05D5\u05E2 \u05E4\u05D5\u05D3\u05E7\u05D0\u05E1\u05D8 \u05E9\u05E7\u05D8"
  ],
  light: [
    "\u05E7\u05E4\u05D4 \u05DE\u05D9\u05D5\u05D7\u05D3 \u05D1\u05D7\u05D5\u05E5 \u2014 20 \u05D3\u05E7\u05D5\u05EA",
    "\u05E0\u05D2\u05D9\u05E0\u05D4 \u05D7\u05D5\u05E4\u05E9\u05D9\u05EA \u2014 30 \u05D3\u05E7\u05D5\u05EA",
    "\u05E7\u05E8\u05D9\u05D0\u05EA \u05E4\u05E8\u05E7 \u05D1\u05E1\u05E4\u05E8 \u2014 25 \u05D3\u05E7\u05D5\u05EA",
    "\u05E1\u05D9\u05D1\u05D5\u05D1 \u05D4\u05DC\u05D9\u05DB\u05D4 \u05E2\u05DD \u05D0\u05D5\u05D6\u05E0\u05D9\u05D5\u05EA \u2014 20 \u05D3\u05E7\u05D5\u05EA",
    "\u05DC\u05E6\u05E4\u05D5\u05EA \u05D1\u05E1\u05E8\u05D8\u05D5\u05DF \u05D9\u05D5\u05D8\u05D9\u05D5\u05D1 \u05D0\u05D7\u05D3 \u05D0\u05E8\u05D5\u05DA",
    "\u05DC\u05E9\u05D1\u05EA \u05D1\u05D7\u05E6\u05E8 \u05E2\u05DD \u05E9\u05EA\u05D9\u05D9\u05D4 \u05E7\u05E8\u05D4",
    "\u05DC\u05E6\u05D9\u05D9\u05E8 / \u05DC\u05E9\u05E8\u05D1\u05D8 \u05D7\u05D5\u05E4\u05E9\u05D9 \u2014 20 \u05D3\u05E7\u05D5\u05EA"
  ],
  thrill: [
    "\u05D9\u05E6\u05D9\u05D0\u05D4 \u05DC\u05DE\u05E1\u05E2\u05D3\u05D4",
    "\u05DE\u05E1\u05D0\u05D6' / \u05E1\u05E4\u05D0",
    "\u05E1\u05E8\u05D8 \u05D1\u05E7\u05D5\u05DC\u05E0\u05D5\u05E2",
    "\u05E0\u05E1\u05D9\u05E2\u05EA \u05EA\u05E2\u05E0\u05D5\u05D2 \u2014 \u05DE\u05E1\u05DC\u05D5\u05DC \u05E6\u05D9\u05D5\u05E8\u05D9",
    "\u05E7\u05E0\u05D9\u05D9\u05EA \u05D2\u05D0\u05D3\u05D2'\u05D8 \u05E7\u05D8\u05DF",
    "\u05E2\u05E8\u05D1 \u05D1\u05D9\u05DC\u05D9\u05D0\u05E8\u05D3 / \u05D1\u05D0\u05D5\u05DC\u05D9\u05E0\u05D2",
    "\u05DC\u05E9\u05EA\u05D5\u05EA \u05D1\u05D9\u05E8\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05D7\u05D3\u05E9"
  ],
  extreme: [
    "\u05E6\u05E0\u05D9\u05D7\u05D4 \u05D7\u05D5\u05E4\u05E9\u05D9\u05EA",
    "\u05E7\u05D0\u05E8\u05D8\u05D9\u05E0\u05D2",
    "\u05E8\u05DB\u05D9\u05D1\u05D4 \u05E2\u05DC \u05D8\u05E8\u05E7\u05D8\u05D5\u05E8\u05D5\u05DF",
    "\u05D8\u05D9\u05E1\u05EA \u05D7\u05D5\u05D5\u05D9\u05D4",
    "\u05D2'\u05D9\u05E4\u05D9\u05DD / \u05D0\u05D5\u05E4\u05E8\u05D5\u05D3",
    "\u05E4\u05D9\u05D9\u05E0\u05D8\u05D1\u05D5\u05DC / \u05D0\u05D9\u05D9\u05E8\u05E1\u05D5\u05E4\u05D8",
    "\u05E8\u05E4\u05D8\u05D9\u05E0\u05D2 / \u05E7\u05D9\u05D0\u05E7\u05D9\u05DD"
  ],
  daddy: [
    "\u05DE\u05D7\u05E0\u05D4 \u05E9\u05DE\u05D9\u05DB\u05D5\u05EA \u05D5\u05E2\u05D5\u05D2\u05D9\u05D5\u05EA",
    "\u05EA\u05D7\u05E8\u05D5\u05EA \u05E8\u05D9\u05E6\u05D4 \u05D1\u05E4\u05D0\u05E8\u05E7",
    "\u05D4\u05DB\u05E0\u05EA \u05DE\u05DE\u05EA\u05E7 \u05D1\u05D9\u05D7\u05D3",
    "\u05E6\u05D9\u05D5\u05E8 \u05D5\u05D9\u05E6\u05D9\u05E8\u05D4 \u05E2\u05DC \u05E9\u05D5\u05DC\u05D7\u05DF \u05D2\u05D3\u05D5\u05DC",
    "\u05DE\u05E9\u05D7\u05E7 \u05DE\u05D7\u05D1\u05D5\u05D0\u05D9\u05DD + \u05D2\u05DC\u05D9\u05D3\u05D4",
    "\u05D1\u05E0\u05D9\u05D9\u05D4 \u05DE\u05E7\u05D5\u05D1\u05D9\u05D5\u05EA / \u05DC\u05D2\u05D5",
    "\u05E1\u05D9\u05E4\u05D5\u05E8 \u05DC\u05E4\u05E0\u05D9 \u05D4\u05E9\u05D9\u05E0\u05D4 + \u05D3\u05DE\u05D9\u05D5\u05DF \u05DE\u05D5\u05D3\u05E8\u05DA",
    "\u05D8\u05D9\u05D5\u05DC \u05E7\u05E6\u05E8 \u05E2\u05DD \u05DE\u05E9\u05D9\u05DE\u05D5\u05EA \u05D2\u05D9\u05DC\u05D5\u05D9"
  ],
  breaker: [
    "\u05E6\u05D0 \u05DC\u05E9\u05EA\u05D5\u05EA \u05D1\u05D9\u05E8\u05D4 \u2014 \u05E2\u05DB\u05E9\u05D9\u05D5",
    "\u05D4\u05D6\u05DE\u05DF \u05DE\u05E9\u05D4\u05D5 \u05D8\u05E2\u05D9\u05DD \u05E9\u05DC\u05D0 \u05D0\u05DB\u05DC\u05EA \u05DE\u05D6\u05DE\u05DF",
    "\u05E1\u05D9\u05D1\u05D5\u05D1 \u05E0\u05E1\u05D9\u05E2\u05D4 \u05DC\u05DC\u05D0 \u05D9\u05E2\u05D3 \u2014 30 \u05D3\u05E7\u05D5\u05EA",
    "\u05EA\u05EA\u05E7\u05E9\u05E8 \u05DC\u05D7\u05D1\u05E8 \u05D5\u05EA\u05E7\u05D1\u05E2 \u05DE\u05E9\u05D4\u05D5",
    "\u05DC\u05DA \u05DC\u05E7\u05E0\u05D5\u05EA \u05DE\u05E9\u05D4\u05D5 \u05E7\u05D8\u05DF \u05E9\u05DE\u05E9\u05DE\u05D7 \u05D0\u05D5\u05EA\u05DA"
  ]
};

var SK = "adrenaline-tracker-v2";
var DS = {adrenalinePoints:0,weeklyThrillCount:0,weekStartDate:null,consecutiveLowDays:0,lastEntryDate:null,rerollAvailable:true,rerollWeekStart:null,history:[],vaultUnlocked:false};

function loadState(){try{var d=localStorage.getItem(SK);return d?JSON.parse(d):JSON.parse(JSON.stringify(DS))}catch(e){return JSON.parse(JSON.stringify(DS))}}
function persistState(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}

var DE = {
  tier: function(p){return p<=50?"recovery":p<=75?"light":p<=90?"thrill":"extreme"},
  daddy: function(){var d=new Date().getDay();return d===1||d===3},
  sameWeek: function(a,b){
    if(!a||!b)return false;
    function sw(d){var x=new Date(d);x.setDate(x.getDate()-x.getDay());return x.toDateString()}
    return sw(a)===sw(b);
  },
  sameDay: function(a,b){return a&&b&&new Date(a).toDateString()===new Date(b).toDateString()},
  yesterday: function(d){if(!d)return false;var y=new Date();y.setDate(y.getDate()-1);return new Date(d).toDateString()===y.toDateString()},
  roll: function(pool){var i=POOLS[pool];return i[Math.floor(Math.random()*i.length)]},
  process: function(pct,state){
    var now=new Date().toISOString();
    var s=JSON.parse(JSON.stringify(state));
    if(!this.sameWeek(s.weekStartDate,now)){s.weeklyThrillCount=0;s.weekStartDate=now;}
    if(!this.sameWeek(s.rerollWeekStart,now)){s.rerollAvailable=true;s.rerollWeekStart=now;}
    if(this.daddy()){
      var prize=this.roll("daddy");s.lastEntryDate=now;
      s.history=[{date:now,percent:pct,prize:prize,tier:"daddy",mode:"daddy"}].concat(s.history.slice(0,99));
      return {s:s,prize:prize,tier:"daddy",mode:"daddy",ap:false,vault:false};
    }
    if(pct<=50){s.consecutiveLowDays=(this.yesterday(s.lastEntryDate)||this.sameDay(s.lastEntryDate,now))?(s.consecutiveLowDays||0)+1:1;}
    else{s.consecutiveLowDays=0;}
    var tier=this.tier(pct),mode="normal",ap=false;
    if(s.consecutiveLowDays>=3){tier="breaker";mode="breaker";s.consecutiveLowDays=0;}
    if(tier==="thrill"){if(s.weeklyThrillCount>=2){tier="light";mode="cooldown";s.adrenalinePoints+=1;ap=true;}else{s.weeklyThrillCount+=1;}}
    if(tier==="extreme"){s.adrenalinePoints+=1;ap=true;tier="light";}
    var vault=false;
    if(s.adrenalinePoints>=10&&!s.vaultUnlocked){s.vaultUnlocked=true;vault=true;}
    var prize=this.roll(tier);s.lastEntryDate=now;
    s.history=[{date:now,percent:pct,prize:prize,tier:tier,mode:mode,ap:ap}].concat(s.history.slice(0,99));
    return {s:s,prize:prize,tier:tier,mode:mode,ap:ap,vault:vault};
  },
  reroll: function(result,state){
    if(!state.rerollAvailable)return null;
    var prize=this.roll(result.tier);
    var s=JSON.parse(JSON.stringify(state));
    s.rerollAvailable=false;
    if(s.history.length){var first=JSON.parse(JSON.stringify(s.history[0]));first.prize=prize;s.history=[first].concat(s.history.slice(1));}
    return {s:s,prize:prize};
  },
  claimVault: function(state){
    var prize=this.roll("extreme");
    var s=JSON.parse(JSON.stringify(state));
    s.adrenalinePoints=s.adrenalinePoints-10;s.vaultUnlocked=false;
    s.history=[{date:new Date().toISOString(),percent:100,prize:prize,tier:"extreme",mode:"vault"}].concat(s.history.slice(0,99));
    return {s:s,prize:prize};
  }
};

var TC={
  recovery:{label:"\u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA",color:"#4a9eff",icon:"\uD83D\uDECC"},
  light:{label:"\u05E0\u05D9\u05EA\u05D5\u05E7 \u05E7\u05DC",color:"#00e5a0",icon:"\u2615"},
  thrill:{label:"\u05E8\u05D9\u05D2\u05D5\u05E9",color:"#ff6b2b",icon:"\uD83D\uDD25"},
  extreme:{label:"\u05D0\u05E7\u05E1\u05D8\u05E8\u05D9\u05DD",color:"#ff2b5e",icon:"\u26A1"},
  daddy:{label:"\u05DE\u05D5\u05D3 \u05D0\u05D1\u05D0",color:"#ffcc00",icon:"\uD83D\uDC68\u200D\uD83D\uDC67"},
  breaker:{label:"\u05E9\u05D5\u05D1\u05E8 \u05E9\u05D2\u05E8\u05D4",color:"#e040fb",icon:"\uD83D\uDCA5"}
};

function Gauge(props){
  var pts=props.pts,max=props.max||10;
  var pct=Math.min(pts/max,1)*100;
  var ang=-135+(pct/100)*270;
  var r=78,cx=100,cy=100;
  function pol(a){return{x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)}}
  var s=pol(-135),e=pol(ang),bgE=pol(135);
  var col=pct>=100?"#ff2b5e":"hsl("+(pct<50?200+pct:30-(pct-50))+","+(80+pct*.2)+"%,55%)";
  var ticks=[];for(var i=0;i<11;i++){ticks.push(-135+(i/10)*270);}
  var tickEls=ticks.map(function(a,i){
    var p1=pol(a);var rad=a*Math.PI/180;
    return h("line",{key:i,x1:p1.x,y1:p1.y,x2:cx+(r+9)*Math.cos(rad),y2:cy+(r+9)*Math.sin(rad),stroke:"#252a35",strokeWidth:i%5===0?2:1});
  });
  var arcPath=pct>0?h("path",{d:"M "+s.x+" "+s.y+" A "+r+" "+r+" 0 "+(ang+135>180?1:0)+" 1 "+e.x+" "+e.y,fill:"none",stroke:col,strokeWidth:"10",strokeLinecap:"round",filter:"url(#gg)",style:{transition:"all 1s cubic-bezier(.23,1,.32,1)"}}):null;
  return h("div",{style:{width:200,height:200,margin:"0 auto",position:"relative"}},
    h("svg",{viewBox:"0 0 200 200",width:"200",height:"200"},
      h("defs",null,
        h("filter",{id:"gg"},
          h("feGaussianBlur",{stdDeviation:"3",result:"b"}),
          h("feMerge",null,
            h("feMergeNode",{"in":"b"}),
            h("feMergeNode",{"in":"SourceGraphic"})
          )
        )
      ),
      h("path",{d:"M "+s.x+" "+s.y+" A "+r+" "+r+" 0 1 1 "+bgE.x+" "+bgE.y,fill:"none",stroke:"#151a24",strokeWidth:"12",strokeLinecap:"round"}),
      tickEls,
      arcPath,
      h("line",{x1:cx,y1:cy,x2:e.x,y2:e.y,stroke:"#d0d0d0",strokeWidth:"2",strokeLinecap:"round",style:{transition:"all 1s cubic-bezier(.23,1,.32,1)"}}),
      h("circle",{cx:cx,cy:cy,r:"5",fill:"#0d1117",stroke:col,strokeWidth:"2"}),
      h("text",{x:cx,y:cy+32,textAnchor:"middle",fill:"#555a65",fontSize:"9",fontFamily:"'JetBrains Mono',monospace"},"ADRENALINE"),
      h("text",{x:cx,y:cy+48,textAnchor:"middle",fill:col,fontSize:"18",fontWeight:"bold",fontFamily:"'JetBrains Mono',monospace"},pts+"/"+max)
    ),
    pct>=100?h("div",{style:{position:"absolute",inset:0,borderRadius:"50%",border:"2px solid rgba(255,43,94,0.3)",animation:"vp 1.5s ease-in-out infinite",pointerEvents:"none"}}):null
  );
}

function Reveal(props){
  var phase_s=useState("scan"),phase=phase_s[0],setPhase=phase_s[1];
  var show_s=useState(false),show=show_s[0],setShow=show_s[1];
  useEffect(function(){var t=setTimeout(function(){setPhase("done");setTimeout(function(){setShow(true)},80)},1600);return function(){clearTimeout(t)}},[]);
  var c=TC[props.tier]||TC.light;
  var ml=props.mode==="breaker"?"\uD83D\uDD04 \u05E9\u05D5\u05D1\u05E8 \u05E9\u05D2\u05E8\u05D4 \u2014 48 \u05E9\u05E2\u05D5\u05EA":props.mode==="cooldown"?"\u2744\uFE0F \u05E7\u05D9\u05E8\u05D5\u05E8 \u2014 \u05E0\u05E7\u05D5\u05D3\u05EA \u05D0\u05D3\u05E8\u05E0\u05DC\u05D9\u05DF":props.mode==="daddy"?"\uD83D\uDC68\u200D\uD83D\uDC67 \u05DE\u05D5\u05D3 \u05D0\u05D1\u05D0":null;
  return h("div",{style:{position:"fixed",inset:0,zIndex:1000,background:"rgba(5,8,15,0.96)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",backdropFilter:"blur(20px)"}},
    phase==="scan"?
      h("div",{style:{textAlign:"center"}},
        h("div",{style:{width:50,height:50,border:"3px solid transparent",borderTop:"3px solid "+c.color,borderRadius:"50%",animation:"sp .7s linear infinite",margin:"0 auto 16px"}}),
        h("div",{style:{fontFamily:"'JetBrains Mono',monospace",color:c.color,fontSize:13,letterSpacing:3}},"...PROCESSING")
      ):
      h("div",{style:{textAlign:"center",padding:28,opacity:show?1:0,transform:show?"translateY(0)":"translateY(24px)",transition:"all .5s cubic-bezier(.23,1,.32,1)"}},
        ml?h("div",{style:{marginBottom:16,padding:"6px 14px",background:"rgba(255,255,255,0.04)",borderRadius:8,fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:c.color,border:"1px solid "+c.color+"33"}},ml):null,
        h("div",{style:{fontSize:54,marginBottom:8}},c.icon),
        h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:c.color,letterSpacing:4,marginBottom:10,textTransform:"uppercase"}},c.label),
        h("div",{style:{fontSize:20,fontWeight:700,color:"#e8eaf0",fontFamily:"'Heebo',sans-serif",direction:"rtl",maxWidth:280,lineHeight:1.5,marginBottom:18}},props.prize),
        props.ap?h("div",{style:{margin:"8px 0",padding:"5px 12px",background:"rgba(255,43,94,0.12)",borderRadius:6,color:"#ff2b5e",fontFamily:"'JetBrains Mono',monospace",fontSize:12,border:"1px solid rgba(255,43,94,0.25)"}},"+1 \u05D0\u05D3\u05E8\u05E0\u05DC\u05D9\u05DF \u26A1"):null,
        props.vault?h("div",{style:{margin:"10px 0",padding:"8px 16px",background:"linear-gradient(135deg,rgba(255,43,94,0.15),rgba(255,107,43,0.15))",borderRadius:8,color:"#ffcc00",fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700,border:"1px solid rgba(255,204,0,0.3)",animation:"vp 1.5s ease-in-out infinite"}},"\uD83D\uDD13 \u05DB\u05E1\u05E4\u05EA \u05D4\u05D0\u05E7\u05E1\u05D8\u05E8\u05D9\u05DD \u05E0\u05E4\u05EA\u05D7\u05D4!"):null,
        h("div",{style:{display:"flex",gap:8,justifyContent:"center",marginTop:20}},
          props.canReroll?h("button",{onClick:props.onReroll,style:{padding:"10px 18px",borderRadius:8,background:"rgba(255,255,255,0.05)",border:"1px solid #2a2f3e",color:"#8a8f9e",fontFamily:"'JetBrains Mono',monospace",fontSize:12}},"\uD83D\uDD04 \u05D2\u05DC\u05D2\u05D5\u05DC"):null,
          h("button",{onClick:props.onClose,style:{padding:"10px 24px",borderRadius:8,background:c.color,border:"none",color:"#0d1117",fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700}},"\u05D0\u05D9\u05E9\u05D5\u05E8 \u2713")
        )
      )

}

function HistoryPanel(props){
  var items=props.items;
  return h("div",{style:{position:"fixed",inset:0,zIndex:900,background:"rgba(5,8,15,0.97)",backdropFilter:"blur(20px)",overflowY:"auto",padding:16,WebkitOverflowScrolling:"touch"}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,direction:"rtl"}},
      h("h2",{style:{fontFamily:"'JetBrains Mono',monospace",color:"#e8eaf0",fontSize:16,margin:0}},"\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D4"),
      h("button",{onClick:props.onClose,style:{background:"none",border:"1px solid #2a2f3e",color:"#6a6f7e",padding:"5px 12px",borderRadius:6,fontFamily:"'JetBrains Mono',monospace",fontSize:11}},"\u2715")
    ),
    items.length===0?
      h("div",{style:{textAlign:"center",color:"#2a2f3e",padding:40,fontFamily:"'JetBrains Mono',monospace",fontSize:13}},"\u05D0\u05D9\u05DF \u05E0\u05EA\u05D5\u05E0\u05D9\u05DD"):
      items.map(function(e,i){
        var t=TC[e.tier]||TC.light;var d=new Date(e.date);

          h("span",{style:{fontSize:20}},t.icon),
          h("div",{style:{flex:1,minWidth:0}},
            h("div",{style:{fontFamily:"'Heebo',sans-serif",color:"#b0b3ba",fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},e.prize),
            h("div",{style:{fontFamily:"'JetBrains Mono',monospace",color:"#3a3f4e",fontSize:10,marginTop:2}},d.getDate()+"/"+(d.getMonth()+1)+" \u00B7 "+t.label+extra)
          ),

function VaultPanel(props){
  return h("div",{style:{position:"fixed",inset:0,zIndex:900,background:"rgba(5,8,15,0.97)",backdropFilter:"blur(20px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}},

    h("p",{style:{fontFamily:"'Heebo',sans-serif",color:"#6a6f7e",fontSize:13,direction:"rtl",textAlign:"center",lineHeight:1.6,marginBottom:16}},
      "10 \u05E0\u05E7\u05D5\u05D3\u05D5\u05EA \u05D0\u05D3\u05E8\u05E0\u05DC\u05D9\u05DF = \u05D4\u05D2\u05E8\u05DC\u05EA \u05D0\u05E7\u05E1\u05D8\u05E8\u05D9\u05DD",h("br"),"\u05E6\u05E0\u05D9\u05D7\u05D4 \u00B7 \u05E7\u05D0\u05E8\u05D8\u05D9\u05E0\u05D2 \u00B7 \u05D0\u05D5\u05E4\u05E8\u05D5\u05D3 \u00B7 \u05D5\u05E2\u05D5\u05D3"),

function App(){
  var st_s=useState(function(){return loadState()}),st=st_s[0],setSt=st_s[1];
  var reveal_s=useState(null),reveal=reveal_s[0],setReveal=reveal_s[1];
  var hist_s=useState(false),hist=hist_s[0],setHist=hist_s[1];
  var vault_s=useState(false),vaultOpen=vault_s[0],setVaultOpen=vault_s[1];
  var input_s=useState(""),input=input_s[0],setInput=input_s[1];
  var mode_s=useState("idle"),mode=mode_s[0],setMode=mode_s[1];
  var err_s=useState(null),err=err_s[0],setErr=err_s[1];
  var fRef=useRef(null);

  function save(ns){setSt(ns);persistState(ns);}

  function go(pct){
    var result=DE.process(pct,st);
    save(result.s);
    setReveal({prize:result.prize,tier:result.tier,mode:result.mode,ap:result.ap,vault:result.vault,pct:pct});
    setMode("idle");setInput("");setErr(null);
  }

  function onFile(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    setMode("proc");setErr(null);
    setTimeout(function(){setMode("manual");setErr("\u05DC\u05D0 \u05D6\u05D5\u05D4\u05D4 \u05DE\u05E1\u05E4\u05E8 \u2014 \u05DB\u05D5\u05D5\u05E0\u05DF \u05D9\u05D3\u05E0\u05D9\u05EA \u05D1\u05E1\u05DC\u05D9\u05D9\u05D3\u05E8")},1200);
    if(fRef.current)fRef.current.value="";
  }

  function onReroll(){
    if(!reveal)return;
    var r=DE.reroll(reveal,st);
    if(r){save(r.s);setReveal({prize:r.prize,tier:reveal.tier,mode:reveal.mode,ap:reveal.ap,vault:reveal.vault,pct:reveal.pct});}
  }

  function onVaultClaim(){
    var r=DE.claimVault(st);
    save(r.s);setVaultOpen(false);
    setReveal({prize:r.prize,tier:"extreme",mode:"vault",ap:false,vault:false,pct:100});
  }

  function onReset(){if(confirm("\u05DC\u05DE\u05D7\u05D5\u05E7 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E0\u05EA\u05D5\u05E0\u05D9\u05DD?")){save(JSON.parse(JSON.stringify(DS)));}}

  var daddy=DE.daddy();
  var days=["\u05E8\u05D0\u05E9\u05D5\u05DF","\u05E9\u05E0\u05D9","\u05E9\u05DC\u05D9\u05E9\u05D9","\u05E8\u05D1\u05D9\u05E2\u05D9","\u05D7\u05DE\u05D9\u05E9\u05D9","\u05E9\u05D9\u05E9\u05D9","\u05E9\u05D1\u05EA"];
  var todayDone=st.lastEntryDate&&DE.sameDay(st.lastEntryDate,new Date().toISOString());

  function SliderInput(){
    var v=input===""?50:parseInt(input)||0;
    var tierLabel=v<=50?"\u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA":v<=75?"\u05E0\u05D9\u05EA\u05D5\u05E7 \u05E7\u05DC":v<=90?"\u05E8\u05D9\u05D2\u05D5\u05E9":"\u05D0\u05D3\u05E8\u05E0\u05DC\u05D9\u05DF +1";
    var tierColor=v<=50?"#4a9eff":v<=75?"#00e5a0":v<=90?"#ff6b2b":"#ff2b5e";
    return h("div",{style:{textAlign:"center",animation:"fadeUp .4s ease"}},
      err?h("div",{style:{marginBottom:10,padding:"6px 10px",borderRadius:6,background:"rgba(255,107,43,0.08)",border:"1px solid rgba(255,107,43,0.15)",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#ff6b2b"}},err):null,
      h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#6a6f7e",marginBottom:14}},"\u05DB\u05D5\u05D5\u05E0\u05DF \u05D0\u05EA \u05D0\u05D7\u05D5\u05D6 \u05D4\u05D4\u05E6\u05DC\u05D7\u05D4 \u05DE-Loop"),
      h("div",{style:{marginBottom:4}},
        h("span",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:52,fontWeight:700,color:"#e8eaf0"}},v),
        h("span",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:24,color:tierColor,marginRight:4}},"%")
      ),
      h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:tierColor,letterSpacing:2,marginBottom:16}},tierLabel),
      h("div",{style:{padding:"0 4px",marginBottom:6}},
        h("input",{type:"range",min:"0",max:"100",value:v,onChange:function(e){setInput(e.target.value)},style:{width:"100%"}}),
        h("div",{style:{display:"flex",justifyContent:"space-between",fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#2a2f3e",marginTop:4}},
          h("span",null,"0"),h("span",null,"50"),h("span",null,"75"),h("span",null,"90"),h("span",null,"100"))
      ),
      h("div",{style:{display:"flex",gap:6,justifyContent:"center",marginTop:16}},
        h("button",{onClick:function(){go(v)},style:{flex:1,padding:"14px 0",borderRadius:10,background:"linear-gradient(135deg,#ff6b2b,#ff2b5e)",color:"#fff",fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:700,boxShadow:"0 4px 18px rgba(255,107,43,0.25)"}},"\u05D0\u05E9\u05E8 \u05D5\u05D4\u05D2\u05E8\u05DC \u25B8"),
        h("button",{onClick:function(){setMode("idle");setErr(null)},style:{padding:"14px",borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid #1a1f2e",color:"#3a3f4e",fontFamily:"'JetBrains Mono',monospace",fontSize:13}},"\u2715")
      )
    );
  }

  return h("div",{style:{minHeight:"100vh",background:"linear-gradient(170deg,#0d1117,#0a0e14 40%,#0f1319)",color:"#e8eaf0",fontFamily:"'Heebo',sans-serif",direction:"rtl",position:"relative"}},
    h("div",{style:{position:"fixed",inset:0,pointerEvents:"none",backgroundImage:"radial-gradient(circle at 20% 80%,rgba(255,107,43,0.03),transparent 50%),radial-gradient(circle at 80% 20%,rgba(74,158,255,0.03),transparent 50%)",zIndex:0}}),
    h("div",{style:{padding:"max(env(safe-area-inset-top,8px),14px) 18px 8px",position:"relative",zIndex:1,borderBottom:"1px solid rgba(255,255,255,0.03)"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("div",null,
          h("h1",{style:{margin:0,fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:700,letterSpacing:1,background:"linear-gradient(90deg,#ff6b2b,#ff2b5e)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"ADRENALINE"),
          h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#2a2f3e",letterSpacing:3,marginTop:1}},"RECOVERY TRACKER")
        ),
        h("div",{style:{display:"flex",gap:5,alignItems:"center"}},
          daddy?h("span",{style:{padding:"3px 8px",borderRadius:10,background:"rgba(255,204,0,0.1)",border:"1px solid rgba(255,204,0,0.2)",fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#ffcc00"}},"\uD83D\uDC68\u200D\uD83D\uDC67"):null,
          h("span",{style:{padding:"3px 8px",borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid #151a24",fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#3a3f4e"}},days[new Date().getDay()])
        )
      )
    ),
    h("div",{style:{padding:"8px 18px calc(90px + env(safe-area-inset-bottom, 0px))",position:"relative",zIndex:1}},
      h("div",{style:{marginTop:6,marginBottom:4}},h(Gauge,{pts:st.adrenalinePoints})),
      h("div",{style:{display:"flex",gap:6,marginBottom:14}},
        [{label:"\u05E8\u05D9\u05D2\u05D5\u05E9",val:st.weeklyThrillCount+"/2",col:"#ff6b2b"},
         {label:"\u05D9\u05DE\u05D9\u05DD \u05E0\u05DE\u05D5\u05DB\u05D9\u05DD",val:st.consecutiveLowDays+"/3",col:st.consecutiveLowDays>=2?"#e040fb":"#4a9eff"},
         {label:"\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D4",val:st.history.length,col:"#00e5a0",click:function(){setHist(true)}}
        ].map(function(x,i){
          return h("div",{key:i,onClick:x.click||null,style:{flex:1,padding:"8px 10px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid #151a24",cursor:x.click?"pointer":"default"}},
            h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#2a2f3e",letterSpacing:1}},x.label),
            h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:18,color:x.col,fontWeight:700,marginTop:3}},x.val));
        })
      ),
      h("div",{style:{textAlign:"center",marginBottom:12,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:st.rerollAvailable?"#4a9eff":"#1a1f2e"}},
        st.rerollAvailable?"\uD83D\uDD04 \u05D0\u05E1\u05D9\u05DE\u05D5\u05DF \u05D4\u05D7\u05DC\u05E4\u05D4 \u05D6\u05DE\u05D9\u05DF":"\uD83D\uDD12 \u05E0\u05D5\u05E6\u05DC \u05D4\u05E9\u05D1\u05D5\u05E2"),
      h("div",{style:{background:"rgba(255,255,255,0.015)",borderRadius:14,border:"1px solid #151a24",padding:18,marginBottom:14}},
        mode==="idle"?(todayDone?
          h("div",{style:{textAlign:"center",padding:8}},
            h("div",{style:{fontSize:32,marginBottom:6}},"\u2705"),
            h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:"#00e5a0"}},"\u05D4\u05D4\u05D2\u05E8\u05DC\u05D4 \u05D1\u05D5\u05E6\u05E2\u05D4"),
            h("div",{style:{fontFamily:"'Heebo',sans-serif",fontSize:12,color:"#3a3f4e",marginTop:4}},st.history[0]?st.history[0].prize:"")
          ):
          h("div",{style:{textAlign:"center"}},
            h("input",{type:"file",accept:"image/*",capture:"environment",ref:fRef,style:{display:"none"},onChange:onFile}),
            h("button",{onClick:function(){fRef.current&&fRef.current.click()},style:{width:"100%",padding:"14px 0",borderRadius:10,background:"linear-gradient(135deg,#ff6b2b,#ff2b5e)",color:"#fff",fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:700,letterSpacing:1,boxShadow:"0 4px 18px rgba(255,107,43,0.25)",marginBottom:8}},"\uD83D\uDCF7 \u05E1\u05E8\u05D5\u05E7 \u05E6\u05D9\u05DC\u05D5\u05DD \u05DE\u05E1\u05DA"),
            h("button",{onClick:function(){setMode("manual")},style:{background:"none",border:"none",color:"#3a3f4e",fontFamily:"'JetBrains Mono',monospace",fontSize:11,padding:"6px 0"}},"\u05D0\u05D5 \u05DB\u05D5\u05D5\u05E0\u05DF \u05D9\u05D3\u05E0\u05D9\u05EA \u25BE")
          )
        ):null,
        mode==="manual"?h(SliderInput):null,
        mode==="proc"?h("div",{style:{textAlign:"center",padding:16}},
          h("div",{style:{width:36,height:36,border:"3px solid transparent",borderTop:"3px solid #ff6b2b",borderRadius:"50%",animation:"sp .7s linear infinite",margin:"0 auto 12px"}}),
          h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#ff6b2b",letterSpacing:2}},"...SCANNING")
        ):null
      ),
      h("button",{onClick:function(){setVaultOpen(true)},style:{
        width:"100%",padding:"12px 0",borderRadius:10,
        background:st.vaultUnlocked?"linear-gradient(135deg,rgba(255,43,94,0.12),rgba(255,107,43,0.12))":"rgba(255,255,255,0.015)",
        border:st.vaultUnlocked?"1px solid rgba(255,43,94,0.35)":"1px solid #151a24",
        color:st.vaultUnlocked?"#ff2b5e":"#2a2f3e",
        fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700,
        animation:st.vaultUnlocked?"vp 2s ease-in-out infinite":"none",marginBottom:8
      }},"\uD83D\uDD10 \u05DB\u05E1\u05E4\u05EA \u05D4\u05D0\u05E7\u05E1\u05D8\u05E8\u05D9\u05DD \u2014 "+st.adrenalinePoints+"/10"),
      h("div",{style:{textAlign:"center",marginTop:16}},
        h("button",{onClick:onReset,style:{background:"none",border:"none",color:"#151a24",fontFamily:"'JetBrains Mono',monospace",fontSize:9}},"\u05D0\u05D9\u05E4\u05D5\u05E1"))
    ),
    reveal?h(Reveal,{prize:reveal.prize,tier:reveal.tier,mode:reveal.mode,ap:reveal.ap,vault:reveal.vault,onClose:function(){setReveal(null)},onReroll:onReroll,canReroll:st.rerollAvailable&&reveal.mode!=="vault"}):null,
    hist?h(HistoryPanel,{items:st.history,onClose:function(){setHist(false)}}):null,
    vaultOpen?h(VaultPanel,{pts:st.adrenalinePoints,onClaim:onVaultClaim,onClose:function(){setVaultOpen(false)}}):null
  );
}

ReactDOM.render(h(App), document.getElementById("root"));
</script>
